[flake8]
max-line-length = 120
docstring_style = sphinx
max-arguments = 6
exps-for-one-empty-line = 0
copyright-check = True
ignore =
    # First line should be in imperative mood
    D401,
    # Class attribute should be private (Django model fields)
    PEO300

per-file-ignores =
    src/main/migrations/*:
        # Django migration classes cannot be frozen/final/private
        PEO200,
        PEO300,
        FIN100,
    src/main/models.py:
        # Django model fields must be public class attributes
        PEO300,
    tests/*:
        # Use of assert detected. The enclosed code will be removed when compiling to optimised byte code.
        S101,
        # Found string literal over-use
        WPS432,
        # Found magic number
        WPS432,
        # Found wrong keyword: pass
        WPS420,
        # Found incorrect node inside `class` body
        WPS604,
        # Found outer scope names shadowing
        WPS442,
        # Found comparison with float or complex number
        WPS459,
        # split between test action and assert
        WPS473,
        # Found compare with falsy constant
        WPS520,
        # Found string literal over-use
        WPS226,
        # Found unpythonic getter or setter
        WPS615,
        # Found overused expression
        WPS204,
        # Missing parameter(s) in Docstring
        DAR101,
        # Missing "Yields" in Docstring: - yield
        DAR301,
        # Not use rst format
        RST,
    src/tests/*:
        S101,
        WPS432,
        WPS420,
        WPS604,
        WPS442,
        WPS459,
        WPS473,
        WPS520,
        WPS226,
        WPS615,
        WPS204,
        DAR101,
        DAR301,
        RST,
        # Class must be frozen
        PEO200,
        # Method must contain override decorator
        OVR100,
        # Found unpythonic getter or setter
        PEO601,
        # Found module with more than one public class
        FOC100,
    src/main/services/github_objs/webhook_manager.py:
        # Private methods forbidden
        NPM100,
        # Method must contain override decorator
        OVR100,
    src/main/migrations/*:
        # Class must be frozen
        PEO200,
        # Class must be final
        FIN100,
