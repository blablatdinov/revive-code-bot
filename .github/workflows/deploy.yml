name: Test and release

on:
  # push:
  #   tags: "*"
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  checks:
    env:
      TZ: "Europe/Moscow"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: almazilaletdinov
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install Poetry
      uses: snok/install-poetry@v1.4.2
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    - name: create .env file
      run: cp .github/.env .env
    - name: Lint via ruff
      run: .venv/bin/ruff check src
    # - name: Lint via flake8
    #   run: .venv/bin/flake8 src
    # - name: Check types with mypy
    #   run: .venv/bin/mypy src
    # - name: Run e2e tests
    #   run: .venv/bin/pytest src/tests/e2e

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get tag name
        id: tag_name
        # run: echo "::set-output name=TAG_NAME::$(echo ${GITHUB_REF#refs/tags/})"
        run: echo "::set-output name=TAG_NAME::$(echo ${GITHUB_SHA})"
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: blablatdinov/revive-code-bot:${{ steps.tag_name.outputs.TAG_NAME }}

  apply-migrations:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
      - name: Apply Migrations
        run: |
          .venv/bin/python src/manage.py migrate
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL }}
          BASIC_AUTH_TOKEN: fake

  update-remote-container:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: '87.249.49.217 ssh-rsa '
      - name: Setup SSH
        run: |
          ssh-keyscan -H 87.249.49.217 >> ~/.ssh/known_hosts
      - name: Get tag name
        id: tag_name
        run: echo "::set-output name=TAG_NAME::$(echo ${GITHUB_SHA})"
      - uses: actions/checkout@v7
      - name: Deploy with docker-compose on remote server
        run: |
          ssh www@87.249.49.217 'echo "Connected!"'
          scp deploy/docker-compose.prod.yml www@87.249.49.217:/home/www/code/revive-code-bot/deploy/docker-compose.prod.yml
          ssh www@87.249.49.217 'cd /home/www/code/revive-code-bot && TAG_NAME=${{ steps.tag_name.outputs.TAG_NAME }} docker compose -f deploy/docker-compose.prod.yml down && TAG_NAME=${{ steps.tag_name.outputs.TAG_NAME }} docker compose -f deploy/docker-compose.prod.yml up -d'
      - name: Remove old images
        run: |
          ssh www@87.249.49.217 'bash -c "docker images | grep revive-code-bot | tail -n +2 | awk \"{print \\$3}\" | xargs -r docker rmi -f"'

